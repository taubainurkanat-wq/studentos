# One-click portfolio preview on Render (disposable demo workspaces)
services:
  - type: web
    name: studentos-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: STUDENTOS_PUBLIC_DEMO
        value: '1'
      - key: STUDENTOS_DB
        value: /tmp/studentos-demo.db
